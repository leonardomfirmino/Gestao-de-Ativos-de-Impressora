spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/api_request_imp
spring.datasource.username=root
spring.datasource.password=admin

# Em produção, informe JWT_SECRET com ao menos 32 caracteres aleatórios.
app.jwt.secret=${JWT_SECRET:troque-esta-chave-de-desenvolvimento-por-uma-chave-segura-32b}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Bootstrap opcional do primeiro administrador. Defina as três variáveis somente uma vez.
app.initial-admin.name=${INITIAL_ADMIN_NAME:leo}
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:leo@testes}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:123}
